{% extends "base.html" %}

{% block title %}Iniciar Sesión - Cliente SOAP{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-box">
        <div class="login-avatar">
            <img src="{{ url_for('static', filename='images/logo_login.png') }}" alt="Monster Avatar" class="avatar-image">
        </div>
        <h1>🔐 Iniciar Sesión</h1>
        <p class="subtitle">Cliente Web SOAP - Monster University</p>
        
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="usuario">Usuario:</label>
                <input type="text" 
                       id="usuario" 
                       name="usuario" 
                       required 
                       autocomplete="username"
                       placeholder="Ingrese su usuario">
            </div>
            
            <div class="form-group">
                <label for="contrasena">Contraseña:</label>
                <input type="password" 
                       id="contrasena" 
                       name="contrasena" 
                       required 
                       autocomplete="current-password"
                       placeholder="Ingrese su contraseña">
            </div>
            
            <button type="submit" class="btn btn-primary">Ingresar</button>
        </form>
    </div>
</div>
{% endblock %}
